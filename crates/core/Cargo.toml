[package]
name = "vitrine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vitrine domain, persistence, discovery and launch logic. No GUI dependency."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
async-trait.workspace = true
sqlx = { workspace = true, optional = true }

[features]
default = ["db"]
# The persistence layer needs a C toolchain (libsqlite3-sys). Gating it keeps the
# pure domain, the launch resolver and the setup registry buildable and testable
# anywhere, which is where the hard-to-reverse logic lives.
db = ["dep:sqlx"]

[dev-dependencies]
tempfile = "3"
