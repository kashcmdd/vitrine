[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "fs", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono"] }

[profile.dev]
# Process supervision and metadata fetching are I/O bound; opt-level 1 for
# dependencies keeps rebuilds fast without making the dev build crawl.
opt-level = 0
