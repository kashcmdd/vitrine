[package]
name = "vitrine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vitrine desktop shell."

[lib]
name = "vitrine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
log = "0.4"

# Note: no `tauri-plugin-shell`. All process spawning goes through the launch
# plan layer in vitrine-core, never through a generic shell escape hatch.
vitrine-core = { path = "../crates/core" }
